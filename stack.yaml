# Compiler-only resolver: the scaffold currently depends only on base.
# Keep this compiler aligned with the GHC supplied by flake.lock.
resolver: ghc-9.10.3

packages:
  - duraflow-core

# Nix owns the toolchain; Stack must not download another GHC.
system-ghc: true
install-ghc: false
compiler-check: match-exact
notify-if-nix-on-path: false

# Enter flake.nix/shell.nix explicitly instead of nesting Stack's Nix shell.
nix:
  enable: false
