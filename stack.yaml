# Keep this snapshot's compiler aligned with the GHC supplied by flake.lock.
resolver: lts-24.59

packages:
  - duraflow-core

# Nix owns the toolchain; Stack must not download another GHC.
system-ghc: true
install-ghc: false
compiler-check: match-exact
notify-if-nix-on-path: false

# Enter flake.nix/shell.nix explicitly instead of nesting Stack's Nix shell.
nix:
  enable: false
