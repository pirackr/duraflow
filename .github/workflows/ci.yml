name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Stack dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.stack
            .stack-work
            duraflow-core/.stack-work
          key: stack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'stack.yaml', 'stack.yaml.lock', '**/*.cabal') }}-${{ hashFiles('**/*.hs') }}
          restore-keys: |
            stack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'stack.yaml', 'stack.yaml.lock', '**/*.cabal') }}-

      - name: Build all components
        run: nix develop --no-write-lock-file --command stack build --test --no-run-tests

      # Currently a placeholder suite; this is not workflow/LLM coverage.
      # CI does not need pi, model credentials, or a running model server.
      - name: Run tests
        run: nix develop --no-write-lock-file --command stack test
